<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEECRIT DESIGN — Евгений Лосев, Game AI Interface Designer</title>
<meta name="description" content="Портфолио Евгения Лосева, Game AI Interface Designer, end-to-end. Игровые интерфейсы для Mobile, PC и консолей: от UX до стиля, иконок, анимаций и внедрения в игру.">
<!-- превью ссылки в соцсетях: адреса полные, LinkedIn не принимает относительные пути -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://leecrit.github.io/">
<meta property="og:title" content="Evgeny Losev — Game AI Interface Designer">
<meta property="og:description" content="Game interfaces for Mobile, PC and console: UX, visual style, icons, animation and in-game integration.">
<meta property="og:image" content="https://leecrit.github.io/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0a0b; --panel:#171112; --panel2:#201618; --line:#2c2023;
  --text:#ece5dd; --mute:#9d918c; --dim:#8a7d77;
  --yellow:#ffd21f; --ember:#ff5a1f; --burg:#4a0d18;
  --fh:'Oswald','Onest',system-ui,sans-serif; --fb:'Onest',system-ui,'Segoe UI',Arial,sans-serif;
  --hw:700; --hls:.01em; --hk:1.22;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
::selection{background:var(--yellow);color:#1a0d00}
:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}
.wrap{width:min(1200px,100% - 64px);margin-inline:auto}

/* top bar */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--bg)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--fh);font-weight:var(--hw);letter-spacing:.04em;font-size:calc(12px*var(--hk))}
.mini{width:34px;height:34px;flex:none}
.mini img{width:100%;height:100%;transform:scale(1.05);filter:drop-shadow(0 0 4px rgba(255,70,10,.8)) drop-shadow(0 0 12px rgba(255,50,0,.4))}
.menu{display:flex;align-items:center;gap:28px;font-size:14px;font-weight:600;color:var(--mute)}
.menu a.l{transition:color .2s}.menu a.l:hover,.menu a.l.on{color:var(--yellow)}
.lang{display:flex;font-size:12px;font-weight:700;gap:10px}
.lang button{color:var(--dim)}.lang button.on{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 22px;background:var(--yellow);color:#1a0d00;font-weight:700;font-size:14px;transition:transform .2s var(--ease),background .2s}
.btn:hover{background:#ffe25c;transform:translateY(-2px)}
.btn.ghost{background:var(--panel2);color:var(--text)}.btn.ghost:hover{background:#2b1d20}

/* hero: компактная строка «кто я» и крупный экран с работами */
/* фон без картинок: тлеющее свечение снизу, рисуется градиентами */
.hero{position:relative;z-index:1;margin-top:64px;overflow:hidden;background:
  radial-gradient(ellipse 42% 22% at 50% 80%,rgba(255,80,20,.24),transparent 70%),
  radial-gradient(ellipse 55% 50% at 50% 56%,rgba(150,24,34,.38),transparent 72%)}
main,.end{position:relative;z-index:1}
/* точки проявляются вокруг курсора по всему сайту; лежат под контентом */
.spot{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(circle,rgba(255,120,50,.95) 1.1px,transparent 1.6px) 0 0/14px 14px;
  -webkit-mask-image:radial-gradient(circle 280px at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.35) 45%,transparent 100%);
  mask-image:radial-gradient(circle 280px at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.35) 45%,transparent 100%)}
.spot.on{opacity:.6}
#embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* подсветка: размытая копия текущего слайда красит фон шапки */
.amb{position:absolute;inset:0;background:center/cover no-repeat;filter:blur(60px) saturate(1.5);opacity:0;transition:opacity 1.4s ease;pointer-events:none;
  /* растр из точек вместо сплошной заливки: цвет читается чётко и гаснет к краям шапки */
  -webkit-mask-image:radial-gradient(circle,#000 1.1px,transparent 1.6px),radial-gradient(ellipse 62% 62% at 50% 54%,#000 35%,transparent 100%);
  mask-image:radial-gradient(circle,#000 1.1px,transparent 1.6px),radial-gradient(ellipse 62% 62% at 50% 54%,#000 35%,transparent 100%);
  -webkit-mask-size:14px 14px,100% 100%;mask-size:14px 14px,100% 100%;
  -webkit-mask-composite:source-in;mask-composite:intersect}
.amb.on{opacity:.55}
.hero .wrap{position:relative;z-index:1;padding:clamp(22px,3vw,36px) 0 clamp(36px,5vw,64px)}
.id{display:grid;grid-template-columns:auto auto 1fr;gap:clamp(16px,2vw,26px);align-items:center;margin-bottom:clamp(20px,2.6vw,30px)}
.ava{width:clamp(76px,7vw,100px);flex:none}
.stamp{position:relative;aspect-ratio:1;background:var(--yellow);padding:10%;transform:rotate(-3deg);transition:transform .5s var(--ease)}
.ava:hover .stamp{transform:rotate(0) scale(1.03)}
.stamp img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:var(--fh);font-size:calc(clamp(24px,3vw,40px)*var(--hk));font-weight:var(--hw);line-height:1.05;letter-spacing:var(--hls);text-transform:uppercase}
.role{font-size:clamp(14px,1.3vw,17px);font-weight:600;margin-top:8px;color:var(--yellow)}
.role span{color:var(--mute);font-weight:500}
.pitch{color:#d9c9c2;max-width:44ch;justify-self:end;font-size:clamp(14px,1.2vw,17px);line-height:1.5}
.in1{opacity:0;animation:up .8s var(--ease) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hs{width:min(100% - 128px,max(560px,calc((100svh - 330px)*16/9)));margin-inline:auto}
.sw{position:relative}
.harr{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;display:grid;place-items:center;background:rgba(32,22,24,.8);color:var(--text);z-index:3;transition:background .2s,color .2s}
.harr:hover{background:var(--yellow);color:#1a0d00}
.harr svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square}
.harr.l{left:-64px}.harr.r{right:-64px}
.screen{position:relative;aspect-ratio:16/9;background:#0b0708;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45),0 46px 110px -24px rgba(255,80,20,.42)}
.slide{position:absolute;inset:0;display:flex;gap:10px;justify-content:center;align-items:center;opacity:0;transition:opacity .9s ease;pointer-events:none}
.slide.multi{padding:14px}
.slide.on{opacity:1;pointer-events:auto}
.slide button{height:100%;min-width:0;flex:0 1 auto;display:flex;justify-content:center}
.slide img,.slide video{height:100%;width:auto;max-width:100%;object-fit:contain}
.slide:not(.multi) button,.slide:not(.multi) img{width:100%}
/* полоса прогресса из сегментов вместо стрелок и точек */
.segs{display:flex;gap:6px;margin-top:10px}
.segs button{flex:1;height:18px;position:relative}
.segs button::before,.segs i{content:"";position:absolute;left:0;top:7px;height:4px}
.segs button::before{right:0;background:rgba(236,229,221,.2);transition:background .2s}
.segs button:hover::before{background:rgba(236,229,221,.4)}
/* transition:none обязателен: без него начатая заливка продолжает ползти у уже пройденных сегментов */
.segs i{width:0;background:var(--yellow);transition:none}
.segs .done i{width:100%}
.segs .on i.run{width:100%;transition:width var(--dur,5s) linear}
.segs .on.hold i{width:100%}
.scap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:6px;font-size:14px}
.scap button{font-weight:600;color:#d9c9c2;transition:color .2s}.scap button:hover{color:var(--yellow)}
.scap span{color:var(--mute);font-variant-numeric:tabular-nums}

/* sections */
section{padding:clamp(64px,8vw,112px) 0}
section+section{padding-top:0}
.shead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,36px)}
h2{font-family:var(--fh);font-size:calc(clamp(20px,2vw,27px)*var(--hk));font-weight:var(--hw);line-height:1.15;letter-spacing:var(--hls)}
.shead small{font-size:15px;font-weight:500;color:var(--mute)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* projects grid: все проекты видны сразу */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.pc{grid-column:span 2;display:block;background:var(--panel);position:relative;transition:transform .35s var(--ease),background .3s}
.pc.big,.pc:nth-child(n+6){grid-column:span 3}
.pc::after{content:"";position:absolute;inset:0;border:2px solid var(--yellow);opacity:0;transition:opacity .2s;pointer-events:none}
.pc:hover,.pc:focus-visible{transform:translateY(-4px);background:var(--panel2);outline:none}
.pc:hover::after,.pc:focus-visible::after{opacity:1}
.pc-img{aspect-ratio:16/9;overflow:hidden;background:#0b0708;display:flex;justify-content:center;align-items:center;gap:8px}
.pc-img.multi{padding:12px}
/* contain: кадр виден целиком, ничего не обрезается */
.pc-img img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.pc-img.multi img{width:auto;max-width:33%;min-width:0;object-fit:contain}
.pc-b{display:grid;gap:2px;padding:16px 18px 18px}
.pc-t{font-family:var(--fh);font-weight:var(--hw);letter-spacing:var(--hls);font-size:calc(15px*var(--hk));line-height:1.3;transition:color .2s}
.pc.big .pc-t{font-size:calc(18px*var(--hk))}
.pc:hover .pc-t,.pc:focus-visible .pc-t{color:var(--yellow)}
.pc-s{color:var(--mute);font-size:14px}

/* best single screens: ровные ряды */
.best{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.best.port{grid-template-columns:repeat(4,1fr);margin-top:20px}
.best .cap{font-size:13px;color:var(--mute);margin-top:8px;font-weight:500}
.shot{display:block;width:100%;cursor:zoom-in;background:var(--panel);position:relative;overflow:hidden}
.shot img,.shot video{width:100%;height:auto;transition:opacity .25s}
.best .shot{aspect-ratio:16/9}
.best.port .shot{aspect-ratio:9/16}
.best .shot img{height:100%;object-fit:contain}
.best .shot:hover img{opacity:.85}

/* experience */
.xp{background:var(--panel);margin-bottom:6px}
.xp summary{list-style:none;display:grid;grid-template-columns:200px 1fr 1fr 24px;gap:20px;align-items:center;padding:18px 24px;cursor:pointer;transition:background .2s}
.xp summary::-webkit-details-marker{display:none}
.xp summary:hover{background:var(--panel2)}
.xp .d{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.xp .c{font-weight:700;font-size:17px}
.xp .r{color:var(--mute);font-size:15px}
.xp .p{color:var(--yellow);font-weight:700;font-size:18px;transition:transform .3s var(--ease);text-align:center}
.xp[open] .p{transform:rotate(45deg)}
.xp .body{padding:2px 24px 22px 244px}
.xp .ctx{color:var(--text);font-size:15px;margin-bottom:8px}
.xp ul{list-style:none;color:var(--mute);font-size:15px;display:grid;gap:5px;max-width:78ch}
.xp li{padding-left:18px;position:relative}
.xp li::before{content:"";position:absolute;left:0;top:.68em;width:6px;height:6px;background:var(--dim)}

/* about */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:56px}
.about .big{font-size:clamp(18px,1.7vw,22px);line-height:1.5}
.about ul{list-style:none;margin-top:18px;display:grid;gap:10px;color:var(--mute)}
.about li{padding-left:20px;position:relative}
.about li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;background:var(--yellow)}
.blk{margin-bottom:26px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;background:var(--panel2);font-size:14px;font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;font-size:15px}.kv dt{color:var(--mute)}

/* contact */
/* свечение у нижнего края страницы: одно на контакты и подвал, без шва между ними */
.end{background:linear-gradient(0deg,rgba(110,18,28,.22) 0%,transparent 85%)}
.contact{position:relative;padding:0 0 clamp(60px,8vw,110px)}
.contact .row{position:relative;background:rgba(23,17,18,.92);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:clamp(24px,4vw,44px)}
.contact h2{margin:0}.contact p{color:var(--mute);margin-top:8px}
.links{display:flex;gap:8px;flex-wrap:wrap}
footer{padding:26px 0 40px;color:var(--dim);font-size:13px}

/* project page */
.page{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none}
.page.open{display:block;animation:pIn .4s var(--ease)}
@keyframes pIn{from{opacity:0;transform:translateY(18px)}}
.p-top{position:sticky;top:0;z-index:2;background:var(--bg)}
.p-top .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
.back{font-weight:600;font-size:14px;color:var(--mute);transition:color .2s}.back:hover{color:var(--yellow)}
.p-nav{display:flex;gap:22px;font-weight:600;font-size:14px;color:var(--mute)}.p-nav button:hover{color:var(--yellow)}
.p-head{padding:28px 0 40px;max-width:860px}
.p-head h2{font-size:calc(clamp(28px,4vw,52px)*var(--hk));margin:6px 0 10px}
.p-head .meta{color:var(--mute);font-weight:500}
.p-head ul{list-style:none;margin:20px 0 24px;display:grid;gap:6px;font-size:17px}
.p-head li{padding-left:20px;position:relative}
.p-head li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;background:var(--yellow)}
.feed{display:grid;gap:20px;padding-bottom:70px}
.feed .ports{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.feed .ports.three{grid-template-columns:repeat(3,1fr)}
.p-end{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--panel);padding:clamp(22px,3vw,36px);margin-bottom:70px}
.p-end h3{font-family:var(--fh);font-weight:var(--hw);font-size:calc(20px*var(--hk));line-height:1.2}
.p-end p{color:var(--mute);margin-top:4px}
.feed{padding-bottom:28px!important}
.sub{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:14px}
.feed .cap{font-size:13px;color:var(--mute);padding-top:8px;display:block}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,5,6,.97);display:none;align-items:center;justify-content:center}
.lb.open{display:flex;animation:lbIn .2s}@keyframes lbIn{from{opacity:0}}
.lb img,.lb video{max-width:92vw;max-height:86vh}
.lb .ctl{position:absolute;font-weight:600;font-size:14px;color:var(--mute);padding:14px 18px;transition:color .2s}
.lb .ctl:hover{color:var(--yellow)}
.lb .x{top:10px;right:14px}.lb .p{left:14px;bottom:8px}.lb .n{right:14px;bottom:8px}
.lb .info{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:13px;color:var(--mute);pointer-events:none}

@media(max-width:900px){
  .id{grid-template-columns:auto 1fr}.pitch{grid-column:1/-1;justify-self:start}
  .hs{width:calc(100% - 128px)}
  .grid{grid-template-columns:repeat(2,1fr)}.pc,.pc.big,.pc:nth-child(n+6){grid-column:span 1}
  .about{grid-template-columns:1fr;gap:32px}.feed .ports,.feed .ports.three{grid-template-columns:repeat(2,1fr)}
  .xp summary{grid-template-columns:1fr 24px;gap:2px 12px}.xp .d{grid-column:1;grid-row:1}.xp .c{grid-column:1}.xp .r{grid-column:1}.xp .p{grid-column:2;grid-row:1/4}
  .xp .body{padding-left:24px}
}
@media(max-width:680px){
  .wrap{width:calc(100% - 36px)}.menu a.l{display:none}.menu{gap:12px}
  .brand,.nav .btn{white-space:nowrap}.brand{font-size:10px;gap:8px}.nav .btn{padding:9px 12px;font-size:13px}
  .grid{grid-template-columns:1fr}
  .best{grid-template-columns:1fr}.best.port{grid-template-columns:repeat(2,1fr)}
  .scap span{display:none}
  .hs{width:100%}.harr{width:40px;height:40px;margin-top:-20px}.harr.l{left:6px}.harr.r{right:6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.in1{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="spot" id="spot"></div>
<nav class="nav"><div class="wrap">
  <a href="#home" class="brand"><span class="mini"><img src="assets/logo-256.png" alt=""></span>LEECRIT DESIGN</a>
  <div class="menu">
    <a class="l" href="#work" data-ru="Проекты" data-en="Projects"></a>
    <a class="l" href="#shots" data-ru="Экраны" data-en="Screens"></a>
    <a class="l" href="#exp" data-ru="Опыт" data-en="Experience"></a>
    <a class="l" href="#about" data-ru="Обо мне" data-en="About"></a>
    <div class="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
    <a class="btn" target="_blank" rel="noopener" href="https://t.me/leecrit">Telegram ↗</a>
  </div>
</div></nav>

<header class="hero" id="home">
  <div class="amb"></div><div class="amb"></div>
  <canvas id="embers"></canvas>
  <div class="wrap">
    <div class="id in1">
      <div class="ava"><div class="stamp"><img src="assets/portrait.jpg" alt="Evgeny Losev"></div></div>
      <div>
        <h1 data-ru="Евгений Лосев" data-en="Evgeny Losev"></h1>
        <div class="role">Game AI Interface Designer, end-to-end <span data-ru="· Mobile · PC · консоли" data-en="· Mobile · PC · Console"></span></div>
      </div>
      <p class="pitch" data-ru="Закрываю весь пайплайн игрового интерфейса: от обсуждения и UX до стиля, иконок, анимаций и внедрения в игру." data-en="I cover the whole game interface pipeline: from discussion and UX to visual style, icons, animation and in-game integration."></p>
    </div>
    <div class="hs in1" style="animation-delay:.15s">
      <div class="sw">
        <button class="harr l" id="hPrev" aria-label="Prev"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
        <div class="screen" id="screen"></div>
        <button class="harr r" id="hNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
      </div>
      <div class="segs" id="segs"></div>
      <div class="scap"><button id="scapT"></button><span id="scapN"></span></div>
    </div>
  </div>
</header>

<main>
<section id="work"><div class="wrap">
  <div class="shead rv"><h2 data-ru="Проекты" data-en="Projects"></h2><small>2023 — 2026</small></div>
  <div class="grid rv" id="grid"></div>
</div></section>

<section id="shots"><div class="wrap">
  <div class="shead rv"><h2 data-ru="Отдельные экраны" data-en="Single screens"></h2><small data-ru="тестовые, фриланс, концепты" data-en="test tasks, freelance, concepts"></small></div>
  <div class="best rv" id="bestL"></div>
  <div class="best port rv" id="bestP"></div>
</div></section>

<section id="exp"><div class="wrap">
  <div class="shead rv"><h2 data-ru="Опыт работы" data-en="Work experience"></h2><small data-ru="игровые интерфейсы с 2021 года" data-en="game interfaces since 2021"></small></div>
  <div id="xp" class="rv"></div>
</div></section>

<section id="about"><div class="wrap">
  <div class="shead rv"><h2 data-ru="Обо мне" data-en="About"></h2></div>

function heroGo(i){

  const dur = $("video", slides[hs]) ? 8000 : 5000;

grid.innerHTML = PROJECTS.map((p,i) => { const c = [].concat(p.cover);
  return `<button class="pc${i<BIG?" big":""}" data-p="${i}"><div class="pc-img${c.length>1?" multi":""}">${c.map(n => `<img loading="lazy" src="assets/${p.id}/${n}${c.length>1||(i>=BIG&&i<5)?"_t":""}.jpg" alt="${typeof p.title==="string"?p.title:p.title.en} game UI">`).join("")}</div><div class="pc-b"><span class="pc-t"></span><span class="pc-s"></span></div></button>`; }).join("");
$$(".pc", grid).forEach(b => b.onclick = () => openP(+b.dataset.p));
/* стрелки клавиатуры переводят фокус между карточками, как в игровом меню */
grid.addEventListener("keydown", e => { const c = $$(".pc", grid), i = c.indexOf(document.activeElement); if(i < 0) return;
  const d = {ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1}[e.key]; if(!d) return; e.preventDefault(); c[(i + d + c.length) % c.length].focus(); });

/* ====== STAMP EDGE (перфорация как у логотипа) ====== */
/* геометрия как у логотипа: 6 вырезов на сторону, углы ровные */
(function(){ let c = ""; for(let i=0;i<6;i++){ const p = 10 + 16*i; c += `<circle cx='${p}' cy='0' r='4.3'/><circle cx='${p}' cy='100' r='4.3'/><circle cx='0' cy='${p}' r='4.3'/><circle cx='100' cy='${p}' r='4.3'/>`; }
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><defs><mask id='m'><rect width='100' height='100' fill='white'/><g fill='black'>${c}</g></mask></defs><rect width='100' height='100' mask='url(#m)'/></svg>`;
  const url = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  $$(".stamp").forEach(s => { s.style.webkitMaskImage = url; s.style.maskImage = url; s.style.webkitMaskSize = s.style.maskSize = "100% 100%"; });
})();

/* ====== BEST SINGLE SCREENS ====== */
const bestHtml = a => a.map(([n,c]) => `<div><button class="shot" data-src="assets/shots/${n}.jpg"><img loading="lazy" src="assets/shots/${n}_t.jpg" alt="${CAPS[c].en} game UI"></button><div class="cap"></div></div>`).join("");
$("#bestL").innerHTML = bestHtml(BEST_L); $("#bestP").innerHTML = bestHtml(BEST_P);
$$("#shots .shot").forEach((el,i,arr) => el.onclick = () => openLB(arr, i, pName("shots")));

/* ====== PROJECT PAGE ====== */
const page = $("#page");
/* у проекта свой адрес (#tanks): им можно поделиться, а «Назад» в браузере закрывает проект */
let pushed = false;
function openP(i, keep, fromUrl){
  const wasOpen = cp >= 0;
  cp = (i + PROJECTS.length) % PROJECTS.length; const p = PROJECTS[cp];
  if(!fromUrl && location.hash !== "#" + p.id){
    if(wasOpen) history.replaceState(null, "", "#" + p.id); else { history.pushState(null, "", "#" + p.id); pushed = true; }
  }
  const isPort = k => p.o === "port";
  const shot = k => `<button class="shot" data-src="assets/${p.id}/${k}.jpg"><img loading="lazy" src="assets/${p.id}/${k}${isPort(k)?"_t":""}.jpg" alt=""></button>`;
  const all = Array.from({length:p.n}, (_,k) => k+1), lands = all.filter(k => !isPort(k)), ports = all.filter(isPort);
  const vids = (p.videos||[]).map(([f,c]) => `<div><button class="shot" data-v="1" data-src="assets/${p.id}/${f}.mp4"><video muted loop playsinline autoplay preload="metadata" src="assets/${p.id}/${f}.mp4"></video></button><span class="cap">${t(c)}</span></div>`).join("");
  $("#pBody").innerHTML = `<div class="p-head"><h2>${t(p.title)}</h2><div class="meta">${p.studio} · ${p.year} · ${t(p.plat)} · ${p.role}</div>
      <ul>${t(p.f).map(x=>`<li>${x}</li>`).join("")}</ul>
      ${p.steam ? `<a class="btn" target="_blank" rel="noopener" href="${p.steam}">${L==="ru"?"Игра в Steam":"View on Steam"} ↗</a>` : ""}</div>
    <div class="feed">
      ${vids ? `<div class="sub">Motion</div><div class="ports">${vids}</div><div class="sub">${L==="ru"?"Экраны":"Screens"}</div>` : ""}
      ${lands.map(shot).join("")}
      ${ports.length ? `<div class="ports${ports.length % 4 && ports.length % 3 === 0 ? " three" : ""}">${ports.map(shot).join("")}</div>` : ""}
    </div>
    <div class="p-end"><div><h3>${L==="ru"?"Нужен такой интерфейс?":"Need an interface like this?"}</h3><p>${L==="ru"?"Быстрее всего отвечаю в Telegram.":"Telegram is the fastest way to reach me."}</p></div>
      <div class="links"><a class="btn" target="_blank" rel="noopener" href="https://t.me/leecrit">Telegram @leecrit ↗</a><button class="btn ghost" id="pNext2">${L==="ru"?"Следующий проект":"Next project"} →</button></div></div>`;
  $("#pNext2").onclick = () => openP(cp+1);
  $$(".shot", page).forEach((el,k,arr) => el.onclick = () => openLB(arr, k, t(p.title)));
  page.classList.add("open"); document.body.style.overflow = "hidden"; if(!keep) page.scrollTop = 0;
  $$("#screen video").forEach(v => v.pause());
}
function closeP(fromUrl){ page.classList.remove("open"); $("#pBody").innerHTML = ""; document.body.style.overflow = ""; cp = -1; heroGo(hs);
  if(fromUrl === true) return;
  if(pushed){ pushed = false; history.back(); } else history.replaceState(null, "", location.pathname + location.search); }
function route(){ const i = pIdx(location.hash.slice(1)); if(i >= 0){ if(i !== cp) openP(i, false, true); } else if(cp >= 0){ pushed = false; closeP(true); } }
addEventListener("popstate", route);
$("#pBack").onclick = () => closeP(); $("#pPrev").onclick = () => openP(cp-1); $("#pNext").onclick = () => openP(cp+1);

/* ====== LIGHTBOX ====== */
const lb = $("#lb"), lbm = $("#lbm"), lbi = $("#lbi"); let set = [], cur = 0, ttl = "";
function show(){ const el = set[cur];
  lbm.innerHTML = el.dataset.v ? `<video src="${el.dataset.src}" autoplay loop controls playsinline></video>` : `<img src="${el.dataset.src}" alt="">`;
  lbi.textContent = `${ttl} · ${cur+1} / ${set.length}`; }
function openLB(arr, i, title){ set = arr; cur = i; ttl = title; show(); lb.classList.add("open"); }
function closeLB(){ lb.classList.remove("open"); lbm.innerHTML = ""; }
const step = d => { cur = (cur + d + set.length) % set.length; show(); };
$(".x",lb).onclick = closeLB; $(".p",lb).onclick = () => step(-1); $(".n",lb).onclick = () => step(1);
lb.onclick = e => { if(e.target === lb || e.target === lbm) closeLB(); };
addEventListener("keydown", e => {
  if(lb.classList.contains("open")){ if(e.key==="Escape") closeLB(); if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1); }
  else if(cp >= 0){ if(e.key==="Escape") closeP(); if(e.key==="ArrowLeft") openP(cp-1); if(e.key==="ArrowRight") openP(cp+1); }
});

/* ====== NAV ====== */
$("#yr").textContent = new Date().getFullYear();
const links = $$(".menu a.l"), nio = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+e.target.id)); }), {rootMargin:"-45% 0px -50% 0px"});
["home","work","shots","exp","about","contact"].forEach(id => nio.observe(document.getElementById(id)));

/* ====== SPOT: точки вокруг курсора (только мышь) ====== */
(function(){ const s = $("#spot"); let x = 0, y = 0, q = false;
  addEventListener("pointermove", e => { if(e.pointerType !== "mouse") return; x = e.clientX; y = e.clientY;
    if(q) return; q = true; requestAnimationFrame(() => { q = false; s.style.setProperty("--mx", x + "px"); s.style.setProperty("--my", y + "px"); s.classList.add("on"); }); }, {passive:true});
  document.documentElement.addEventListener("mouseleave", () => s.classList.remove("on"));
})();

/* ====== EMBERS: только в верхнем блоке, останавливаются вне экрана ====== */
(function(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c = $("#embers"), x = c.getContext("2d"), host = $("#home"); let W, H, P = [], run = false;
  const sp = document.createElement("canvas"); sp.width = sp.height = 32;
  const g = sp.getContext("2d"), gr = g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,"rgba(255,225,120,1)"); gr.addColorStop(.25,"rgba(255,170,40,.7)"); gr.addColorStop(1,"rgba(255,60,0,0)");
  g.fillStyle = gr; g.fillRect(0,0,32,32);
  const mk = init => ({x:Math.random()*W, y:init ? Math.random()*H : H+10, s:Math.random()*8+3, vx:Math.random()*.3+.05, vy:-(Math.random()*.22+.06), a:Math.random()*.5+.15, ph:Math.random()*6.28});
  function size(){ W = c.width = host.clientWidth; H = c.height = host.clientHeight; P = Array.from({length:Math.min(40,Math.round(W/36))}, () => mk(true)); }
  function draw(){
    if(!run) return; x.clearRect(0,0,W,H);
    for(const p of P){ p.x += p.vx + Math.sin(p.ph)*.12; p.y += p.vy; p.ph += .012;
      if(p.y < -12 || p.x > W+12) Object.assign(p, mk(false));
      x.globalAlpha = p.a * (.6 + .4*Math.sin(p.ph*2.5)); x.drawImage(sp, p.x, p.y, p.s, p.s); }
    requestAnimationFrame(draw);
  }
  new IntersectionObserver(es => { const v = es[0].isIntersecting; if(v && !run){ run = true; draw(); } else if(!v) run = false; }).observe(host);
  addEventListener("resize", size); size();
})();

render();
heroGo(0);
route();
</script>
</body>
</html>
